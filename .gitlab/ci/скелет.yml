# Гейт скелета репозитория.
#
# Не требует ни одного внешнего средства: ловит незаполненный шаблон,
# отсутствующие зоны, битые относительные ссылки в документах и описание
# конвейера, которое YAML прочитает не так, как написано.
#
# Последнее задание конвейера поймать за себя не может: пайплайн с нечитаемым
# описанием GitLab не создаёт вовсе, и не запускается ни одно задание — включая
# это. Поэтому ту же проверку запускают руками до отправки: на такой находке она
# роняет себя даже без TRIP_GATE_STRICT.

скелет:
  stage: проверка
  image: $NODE_IMAGE
  script:
    - |
      if [ "$TRIP_GATE_STRICT" = "1" ]; then
        node ИНСТРУМЕНТЫ/скрипты/проверить-скелет.mjs --строго
      else
        node ИНСТРУМЕНТЫ/скрипты/проверить-скелет.mjs
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Проверки самих проверок: падают, если гейт скелета перестанет находить
# незаменённые плейсхолдеры и битые ссылки, а сборщик адресов — собирать адрес
# выпуска. Гейт, переставший ловить, выглядит так же, как гейт, которому нечего
# ловить, — различает их только этот прогон.
самопроверка:
  stage: проверка
  image: $NODE_IMAGE
  script:
    - node --test ИНСТРУМЕНТЫ/скрипты/проверки.test.mjs
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
