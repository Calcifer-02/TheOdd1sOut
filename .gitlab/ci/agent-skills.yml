# Гейт навыков агента.
#
# Пока порция Gate 2 не пришла, гейт сообщает, что навыки не установлены, и
# проходит: отсутствие поставки — не находка, а состояние контрольной точки.
#
# После установки проверяет: у каждого каталога есть SKILL.md, имя навыка
# совпадает с именем каталога, имена уникальны, отпечатки совпадают с замком,
# реестр не разошёлся с установкой.
#
# Гейт ловит правку установленной копии в обход канона. Такая копия перестаёт
# получать исправления методологии, а расхождение обнаруживается не тогда,
# когда сделано, а тогда, когда агент отработал по устаревшей инструкции.

навыки:
  stage: проверка
  image: $NODE_IMAGE
  script:
    - |
      if [ "$TRIP_GATE_STRICT" = "1" ]; then
        node ИНСТРУМЕНТЫ/скрипты/навыки.mjs проверить --строго
      else
        node ИНСТРУМЕНТЫ/скрипты/навыки.mjs проверить
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
