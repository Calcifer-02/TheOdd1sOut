# Гейт средств слоя B.
#
# Показывает, какие средства проекту нужны с текущей контрольной точки и какие
# из них доступны. Задание не ставит средства в сборку: оно отвечает на вопрос
# «чем сегодня подтверждается качество и чего не хватает».

средства:
  stage: проверка
  image: $NODE_IMAGE
  script:
    - |
      if [ "$TRIP_GATE_STRICT" = "1" ]; then
        node ИНСТРУМЕНТЫ/скрипты/инструменты.mjs проверить --строго
      else
        node ИНСТРУМЕНТЫ/скрипты/инструменты.mjs проверить
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
