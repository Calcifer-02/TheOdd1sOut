# Гейт формы кода.
#
# Проверяет то, ради чего в проекте стоит средство КАСТА: чем является каждое
# место корпуса и какие связи между местами допустимы. Роль места и границы
# ограниченных контекстов объявляет человек в trip/cast-agreement.json;
# средство лишь сверяет объявленное с написанным.
#
# Почему это здесь, а не только в перехвате коммита. Локальный перехват — ранняя
# остановка на машине автора: он делает правильный путь дешёвым, но снимается
# одной командой и не ставится вовсе, если участник пропустил установку. Правило
# считается действующим, только когда его держит серверный барьер.
#
# Задание запускается, только когда объявлено конструктивное соглашение зон:
# без него правилам нечего проверять, и молчаливое «зелено» было бы неправдой.
# Пока соглашения нет, работает задание «форма:не объявлена» — оно сообщает
# пробел, а не выдаёт его за пройденную проверку.
#
# Коды выхода средства: 0 — чисто; 2 — только предупреждения; 3 — находка-ошибка;
# 1 — техническая ошибка, несовместимость соглашения, конфликт зон.
#
# TRIP_GATE_STRICT=1 переводит предупреждения в отказ. До этого предупреждения
# видны в журнале задания и не роняют сборку: свод правил обкатывается на
# корпусе проекта, а не назначается ему готовым.

форма:
  stage: проверка
  image: $NODE_IMAGE
  variables:
    GIT_DEPTH: 0
  script:
    - node ИНСТРУМЕНТЫ/скрипты/инструменты.mjs установить trip-cast
    - CAST=$(find .trip/tools/trip-cast -type f -name 'trip-cast*' ! -name '*.tar.gz' | head -n 1)
    - test -n "$CAST" || { echo "В выпуске не найден исполняемый файл trip-cast"; exit 1; }
    - chmod +x "$CAST"
    - |
      set +e
      "$CAST" check --root .
      code=$?
      set -e
      echo "код завершения проверки формы: $code"
      case "$code" in
        0) exit 0 ;;
        2)
          if [ "$TRIP_GATE_STRICT" = "1" ]; then
            echo "Предупреждения формы кода роняют задание: TRIP_GATE_STRICT=1."
            exit 1
          fi
          echo "Предупреждения формы кода: разберите их до следующей контрольной точки."
          exit 0
          ;;
        *) exit "$code" ;;
      esac
  rules:
    - if: '$TRIP_TOOLS_TOKEN && ($CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH)'
      exists:
        - trip/cast-agreement.json

форма:не объявлена:
  stage: проверка
  image: $NODE_IMAGE
  allow_failure: true
  script:
    # Средство читает .ts, .tsx, .mts, .py, .pyi и .cs. Если такого кода в
    # репозитории нет, советовать завести соглашение — значит отправлять
    # человека описывать пустоту: объявлять будет нечего.
    - |
      READABLE=$(find . -path ./.git -prune -o -path ./node_modules -prune -o \
        \( -name '*.ts' -o -name '*.tsx' -o -name '*.mts' -o -name '*.py' \
           -o -name '*.pyi' -o -name '*.cs' \) -print 2>/dev/null | head -n 1)
      if [ -z "$READABLE" ]; then
        echo "Форма кода не проверяется: кода, который средство читает, в репозитории нет."
        echo "Читаются .ts, .tsx, .mts, .py, .pyi и .cs. Заводить конструктивное соглашение"
        echo "пока не над чем — объявлять роли мест было бы описанием пустоты."
        echo "Задание станет настоящей проверкой само, как только такой код появится."
      else
        echo "Форма кода не проверяется: конструктивное соглашение зон не объявлено."
        echo "Пока в trip/cast-agreement.json нет ролей мест, ни одно правило домена ARCH ничего не утверждает:"
        echo "направления связей между зонами физически не проверяются, если зона одна или зон нет вовсе."
        echo "Порядок: скопируйте trip/cast-agreement.пример.json, объявите роли мест и границы контекстов,"
        echo "сошлитесь на запись архитектурного решения и снимите заготовку с примера."
        echo "Роль места объявляет человек: средство не выводит её из имени каталога."
      fi
      # Красный в обоих случаях намеренно: «не проверено» не равно «проверено»,
      # и зелёное задание, ничего не проверившее, выдавало бы пробел за пройденную
      # проверку. Отказ разрешён, конвейер от него не падает.
      exit 1
  rules:
    - exists:
        - trip/cast-agreement.json
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

форма:не настроен:
  stage: проверка
  image: $NODE_IMAGE
  allow_failure: true
  script:
    - 'echo "Гейт формы кода не настроен: нет TRIP_TOOLS_TOKEN, средство не установить."'
    - 'echo "Соглашение зон объявлено, но проверить его нечем — это пробел доступа, а не проекта."'
    - 'echo "Порядок настройки — у ведущего; описан в ИНСТРУМЕНТЫ/README.md, раздел «Доступ без личных учётных записей»."'
    - exit 1
  rules:
    - if: '$TRIP_TOOLS_TOKEN'
      when: never
    - exists:
        - trip/cast-agreement.json
      if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
