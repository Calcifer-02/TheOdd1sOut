# Гейт документации проекта.
#
# Образцы видов артефактов берутся из выданной порции методологии, охват —
# рабочие документы проекта. Порция Gate 0 в охват не входит: она выдана
# и не правится, а её проверка выполняется на стороне методологии.

templates_root = "МЕТОДОЛОГИЯ/ДОКУМЕНТЫ/01_ПАКЕТ_АРТЕФАКТОВ_АНАЛИТИКИ"
include = ["docs/**/*.md"]
# Зеркало решения методологии: вспомогательные документы 05_АНКЕТЫ без
# признанного вида артефакта эталона не имеют, и проверки состава по нему
# отвечают «не проверено». Методология исключает их у себя тем же списком —
# проект обязан судить по тем же правилам, иначе один и тот же документ
# оказывается годным в каноне и негодным в проекте. Возврат в охват — после
# решения методологии о видах вспомогательных документов.
exclude = [
    "docs/**/ВХОДНАЯ_АНКЕТА_КОМАНДЫ.md",
    "docs/**/КАТАЛОГ_*.md",
    "docs/**/ПРАВИЛА_ПРИМЕНИМОСТИ.md",
    "docs/**/ПРОФИЛЬ_СИСТЕМЫ.md",
    "docs/**/СЛОВАРЬ_РОЛЕЙ_МЕСТ_В_КОДЕ.md",
    "docs/**/СОГЛАШЕНИЕ_*.md",
    # Исследовательские записки проекта: вида артефакта в выданной порции
    # методологии у них нет, поэтому проверка состава по эталону отвечать не
    # может. Паспорт, связанные артефакты и язык они соблюдают наравне с
    # остальными документами; возврат в охват — когда методология объявит вид
    # для аналитической записки.
    "docs/**/ОТЧЁТ_ЗАКОНОДАТЕЛЬСТВО_*.md",
    # Записи архитектурных решений: вид АР-01 задаёт три взаимоисключающих
    # требования, и проектная запись не проходит проверку ни в каком виде.
    # Раздел-рамка «Соглашения» обязателен (DOC-C01), обязан совпадать с
    # эталоном дословно (DOC-C06), но дословный текст объявляет дату и автора
    # вне паспорта (DOC-C11) — все три правила блокирующие. Проверено тремя
    # прогонами 19.09.2026 на ЗАПИСЬ_АРХИТЕКТУРНОГО_РЕШЕНИЯ_ADR-0001.md:
    # дословно — DOC-C11 дважды, с правкой формулировок — DOC-C06, без раздела
    # — DOC-C01. Дефект эталона передаётся методологии; возврат в охват — после
    # его исправления, а не после правки записей под инструмент.
    "docs/architecture/ЗАПИСЬ_АРХИТЕКТУРНОГО_РЕШЕНИЯ_ADR-*.md",
]
select = ["DOC-F", "DOC-R", "DOC-C", "DOC-L", "DOC-M", "DOC-S", "DOC-X"]

[gate]
blocking_categories = ["form", "composition"]
changed_only = false
