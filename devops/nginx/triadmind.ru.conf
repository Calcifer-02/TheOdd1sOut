# Внешний узел стенда triadmind.ru.
#
# Это целевое состояние конфигурации, а не снимок того, что стоит на сервере:
# перед применением сличите её с действующей, а не перезаписывайте вслепую.
# Файл лежит в репозитории, потому что адрес стенда — сдаточный артефакт
# (условия трека, разд. 6.2 п. 1), а не личное знание владельца сервера.
#
# Решение о размещении: ADR-0004. Расчётная часть стоит путём на общем узле
# с мини-приложением. Один источник — нет CORS в webview платформы MAX;
# действующий сертификат выпущен на одно имя triadmind.ru и поддомены
# не покрывает.
#
# Применение:
#     sudo cp triadmind.ru.conf /etc/nginx/sites-available/triadmind.ru
#     sudo nginx -t && sudo systemctl reload nginx
#
# Проверка после применения:  sh tests/devops/проверка-стенда.sh

server {
    listen 80;
    listen [::]:80;
    server_name triadmind.ru;

    # Мини-приложение платформы MAX работает только по HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Форма записи для nginx 1.24, который стоит на стенде: отдельная
    # директива http2 появилась только в 1.25.1 и здесь не разбирается.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name triadmind.ru;

    ssl_certificate     /etc/letsencrypt/live/triadmind.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/triadmind.ru/privkey.pem;

    # Порты слева — значения API_PORT, BOT_PORT и MINIAPP_PORT из .env
    # на сервере. Службы слушают только петлевой адрес: наружу они выходят
    # через этот узел и никак иначе.

    # Расчётная часть. Префикс /api срезается косой чертой в конце proxy_pass:
    # снаружи путь /api/v1/calculations, внутри — /v1/calculations, ровно как
    # в договоре. Базовый адрес договора объявлен как https://triadmind.ru/api.
    location /api/ {
        proxy_pass http://127.0.0.1:18080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Коммерческое предложение отдаётся файлом; ответ не буферизуется
        # целиком в память узла.
        proxy_buffering off;
    }

    # Приём обновлений платформы чат-ботом. Токен живёт в окружении службы
    # и через этот узел не проходит.
    location /bot/ {
        proxy_pass http://127.0.0.1:18081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ловушка, из-за которой этот файл и заведён. Ниже по тексту мини-приложение
    # отдаёт свою страницу на любой неизвестный путь — так работает одностраничное
    # приложение. Клиент договора, собравший путь без префикса /api, получал бы
    # код 200 и разметку вместо данных: отказ, выглядящий как успех. Пути
    # договора вне /api отвечают честным отказом с указанием верного адреса.
    location ~ ^/(v1|swagger)(/|$) {
        default_type application/problem+json;
        return 404 '{"type":"urn:imolt:problem:wrong-base-url","title":"Неверный базовый адрес","status":404,"detail":"Договор обслуживается по адресу https://triadmind.ru/api — добавьте префикс /api к пути."}';
    }

    # Мини-приложение: статика и возврат разметки на внутренние маршруты.
    location / {
        proxy_pass http://127.0.0.1:15173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
