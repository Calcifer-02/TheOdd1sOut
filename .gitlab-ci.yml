# Гейты проекта TRIP.
#
# Состав намеренно скромный: гейт либо действительно проверяет, либо честно
# сообщает, что средство не настроено. Зелёное задание, которое ничего не
# проверило, хуже отсутствующего — оно выдаёт пробел за пройденную проверку.
#
# Переменные задаются на группе проектов, а не в этом файле:
#   TRIP_TOOLS_TOKEN       токен только на чтение реестра пакетов инструментов
#   TRIP_TOOLS_TOKEN_KIND  вид токена: deploy, private или job
#   TRIP_GATE_STRICT       "1" переводит гейты из предупреждающих в роняющие
#
# Пока команда приводит шаблон к проекту, гейты предупреждают. Когда шаблон
# приведён, TRIP_GATE_STRICT переводится в "1" и находки начинают ронять сборку.
#
# Гейт следа исключение: он роняет запрос на слияние с первого дня и не ждёт
# TRIP_GATE_STRICT. Правила ветки и коммита не калибруются по ходу проекта, а
# след, снятый задним числом, уже не восстанавливается.

stages:
  - проверка

variables:
  NODE_IMAGE: "node:22-bookworm-slim"

include:
  - local: .gitlab/ci/git-trail.yml
  - local: .gitlab/ci/skeleton.yml
  - local: .gitlab/ci/agent-skills.yml
  - local: .gitlab/ci/training-wheels.yml
  - local: .gitlab/ci/code-form.yml
  - local: .gitlab/ci/code-lint.yml
  - local: .gitlab/ci/docs.yml
