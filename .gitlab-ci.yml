# Гейты проекта TRIP.
#
# Состав намеренно скромный: гейт либо действительно проверяет, либо честно
# сообщает, что средство не настроено. Зелёное задание, которое ничего не
# проверило, хуже отсутствующего — оно выдаёт пробел за пройденную проверку.
#
# Переменные задаются на группе проектов, а не в этом файле:
#   TRIP_TOOLS_TOKEN       токен только на чтение реестра пакетов инструментов
#   TRIP_TOOLS_TOKEN_KIND  вид токена: deploy, private или job
#   TRIP_GATE_STRICT       "0" временно опускает гейты до предупреждающих
#
# Строгий режим включён по умолчанию — переменной ниже. Это изменение опыта
# пилота: прежде гейты предупреждали, пока команда не выставит TRIP_GATE_STRICT=1,
# и выставить его было некому. Средство, о котором никто не вспомнил, молчит
# ровно так же, как средство, которого нет, — и проект четыре захода шёл без
# проверки конструктивных границ, не зная об этом.
#
# Послабление осталось, но сменило сторону: теперь его надо объявить. Строка
# TRIP_GATE_STRICT=0 на группе или в проекте видна в настройках и в истории,
# а забывчивость больше не выглядит как пройденная проверка. Снимать послабление
# полагается на ближайшей контрольной точке.
#
# Гейт следа исключение в другую сторону: он роняет запрос на слияние с первого
# дня и TRIP_GATE_STRICT не слушает вовсе. Правила ветки и коммита не калибруются
# по ходу проекта, а след, снятый задним числом, уже не восстанавливается.

# Общие исполнители этого GitLab берут только помеченные задания: метка `test` —
# docker-исполнители группы, образ задаётся заданием. Без метки задание висит
# с сообщением «project doesn't have any runners online assigned to it».
# Проект со своим исполнителем меняет метку здесь, а не в файлах гейтов.
default:
  tags:
    - test

stages:
  - проверка

variables:
  NODE_IMAGE: "node:22-bookworm-slim"
  # Значение по умолчанию. Переменная группы или проекта его перекрывает —
  # так послабление становится объявленным решением, а не умолчанием.
  TRIP_GATE_STRICT: "1"

include:
  - local: .gitlab/ci/git-trail.yml
  - local: .gitlab/ci/skeleton.yml
  - local: .gitlab/ci/agent-skills.yml
  - local: .gitlab/ci/training-wheels.yml
  - local: .gitlab/ci/code-form.yml
  - local: .gitlab/ci/code-lint.yml
  - local: .gitlab/ci/docs.yml
