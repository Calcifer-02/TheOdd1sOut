# Профиль обвязки ИИ-агента.
#
# Версионируется и ревьюируется как код: непроверяемый профиль молча
# расходится с действительностью и перестаёт выполнять своё назначение.
# В день 1 заполняется минимум уровня AE0 — четыре поля ниже; остальное
# достраивается по мере подключения средств.

project_id: <идентификатор-проекта>
agentic_level: AE0

coding_agent:
  primary_tool: <название инструмента-агента>

rule_files:
  - AGENTS.md
  - CLAUDE.md

# Достраивается позже: context, tools, sandbox, limiters, checks,
# human_decision_zones. Пустое поле честнее выдуманного.
