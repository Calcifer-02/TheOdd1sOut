# Настройка линтера кода TRIP для ИМОЛТ.
#
# До этой записи средство отвечало «не проверили: конфигурация не найдена», и
# барьера кода у проекта не было вовсе — пробел был записан в память проекта и
# назывался в каждом отчёте.
#
# Пресеты движка фронтенда лежат в реестре пакетов внутреннего GitLab, а не в
# публичном npm: адрес реестра и способ получения токена — в `src/front/.npmrc`.
schema = "trip.lint-config/v1"

[frontend]
root = "src/front"

[dotnet]
root = "src/back"
solution = "Imolt.slnx"
# Проверки лежат и рядом с кодом, и в общем каталоге проверок репозитория.
test_projects = ["**/*.Tests/**", "**/tests/**"]

[sql]
# Схема базы ведётся нумерованными миграциями, а не оснасткой времени
# разработки (ADR-0002): движок SQL смотрит именно их.
migrations = ["src/back/Imolt.Database/Migrations/*.sql"]
# Своего package.json в корне репозитория нет, и пакет squawk-cli средство от
# корня не находит. Команда названа явно; настройку, перечень миграций и ключи
# средство передаёт ей переменными окружения, поэтому нужна обёртка, а не голый
# вызов.
squawk = "node devops/линтер-sql.mjs"

[gate]
# Режим `changed`: блокируют находки-ошибки в изменённых файлах. Разбор корпуса
# остаётся полным, предупреждения работу не останавливают.
#
# Исходный уровень разобран, а не заморожен рассрочкой: из 170 ошибок корпуса
# закрыты 169 — оформление мини-приложения и расчётной части, маркеры
# трассировки в строчных комментариях (сканер их не читал), ссылки на файлы,
# формат дат, неиспользуемые подключения, вложенные условные выражения и
# невидимые неразрывные пробелы в регулярных выражениях.
#
# Остаётся одна: `src/back/Directory.Build.props` не подключает пакет
# `Trip.CodeStyle`, и слой дисциплины анализаторов .NET не проверяется. Пакет
# лежит в реестре NuGet внутреннего GitLab, координаты которого токеном
# развёртывания не разрешаются. Файл в работе не меняется, поэтому в режиме
# `changed` находка не блокирует; закрыть её — отдельный шаг, владелец ответа
# тот, у кого есть доступ к реестру.
#
# 381 предупреждение остаётся названным долгом: 316 имён проверок без явного
# разделителя условия и результата, 41 асинхронная функция без суффикса
# `Async`, 24 длинных комментария и три английские фразы в русских
# комментариях. Предупреждение работу не останавливает и под рассрочку не
# прячется.
mode = "changed"
raised_to_error = []

[comments]
# Слова глоссария проекта, которые стоят в коде латиницей и английской прозой
# не являются: имена служб, протоколов и средств.
terms = ["MAX", "OSRM", "OpenStreetMap", "FSD", "ODbL", "PDF", "SQL", "URN", "ARIA"]

[baseline]
# Рассрочка ровно на две находки: собственные пресеты линтера не видны в
# публичном реестре npm, потому что живут во внутреннем. Дефект средства заведён
# BUG-013 и назван владельцем; рассрочка на корпус не заводится — замороженный
# корпус это театр покрытия, а не проверка. Дом не `trip/`: под политикой
# `generic` эта папка неизменяема.
file = "devops/lint-baseline.json"
