# Конфигурация проверки интерфейса прикладного программирования «ИМОЛТ».
# Условия трека «Эффективный бизнес», разд. 6.2 п. 5.
#
# Перечень точек собран из договора и обязан ему соответствовать:
# src/back/Imolt.Api/contracts/openapi.yaml. Расхождение ловит проверка
# tests/contracts/Imolt.Contracts.Tests — она сверяет метод, путь, роль и
# ожидаемые коды каждой точки этого файла с договором.
#
# Поле state отделяет то, что служба уже отдаёт, от того, что пока только
# объявлено: проверяющий видит это до первого запроса, а не после.

configVersion: "1.0"
solution: ИМОЛТ — расчёт стоимости вывоза и утилизации строительных отходов
repository: https://github.com/Calcifer-02/TheOdd1sOut
contract: src/back/Imolt.Api/contracts/openapi.yaml
baseUrl: https://triadmind.ru/api

# Базовый адрес берётся целиком. Собирать путь от корня узла нельзя: там
# стоит мини-приложение, и неизвестный путь возвращает его страницу с кодом
# 200 — ошибка выглядит как успех (ADR-0004).
baseUrlNotes:
  local: http://localhost:18080
  mock: http://localhost:4010

roles:
  - id: guest
    name: Клиент без входа
    description: >-
      Расчёт, подбор полигонов и коммерческое предложение задуманы доступными
      без входа. Учётная запись не нужна.
    credentials: не требуются
  - id: authenticated
    name: Участник с сессией
    description: >-
      Перевозчик, демонтажная компания или менеджер данных. Личность даёт
      платформа MAX: мини-приложение передаёт строку стартовых параметров
      в операцию createSession, и та выдаёт маркер (ADR-0006).
    credentials: >-
      Отдельных учётных записей у сервиса нет и не будет: вход — это учётная
      запись MAX, из которой открыто мини-приложение. Проверяющий получает
      маркер, открыв мини-приложение в MAX.

# Какие проверки можно выполнить на стенде сегодня. Остальные точки объявлены
# договором, но обработчиков не имеют — на них служба отвечает 404.
mandatoryChecks:
  - getHealth
  - getReadiness
  - listWasteGroups
  - getWasteGroup
  - listLandfills
  - getLandfill
  - listLandfillReviews
  - getDataFreshness
  - suggestAddresses
  - convertAmounts
  - createCalculation
  - getCalculation
  - listPlacementOptions
  - setCalculationSelection
  - setCalculationAllocation
  - getCalculationRoute
  - createQuote
  - downloadQuoteDocument
  - createPickupRequest
  - listDocumentServices

# Что именно не определено заказчиком и потому не проверяется по существу:
