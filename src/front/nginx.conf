# Отдача статики мини-приложения и проксирование обращений к расчётной части.
# Имя api — имя службы в compose.yaml; обращения идут по внутренней сети,
# наружу расчётная часть открывается отдельным отображением портов.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Мини-приложение — одностраничное: неизвестные пути отдают разметку,
    # иначе перезагрузка страницы на внутреннем маршруте даёт 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
