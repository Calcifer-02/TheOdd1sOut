  <text x="112" y="286" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#111111">Вывоз и утилизация отходов</text>
  <text x="112" y="356" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" fill="#111111">строительства и сноса</text>
  <text x="112" y="428" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#6B6B6B">Москва и Московская область. Перевозка и утилизация — отдельно</text>
