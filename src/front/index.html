<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Заголовок до отрисовки: дальше его ведёт приложение, называя открытый экран. -->
    <title>ИМОЛТ — расчёт вывоза и утилизации отходов строительства и сноса</title>
    <meta
      name="description"
      content="Расчёт стоимости вывоза и утилизации отходов строительства и сноса по Москве и Московской области: перевозка и утилизация считаются отдельно по каждому полигону, расстояние — по дорожной сети."
    />
    <link rel="canonical" href="%SITE_ORIGIN%/" />
    <meta name="theme-color" content="#EFEEF1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Предпросмотр ссылки в переписке: без этих строк MAX показывает голый адрес. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ИМОЛТ" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="%SITE_ORIGIN%/" />
    <meta property="og:title" content="ИМОЛТ — расчёт вывоза и утилизации отходов" />
    <meta
      property="og:description"
      content="Цена видна сразу, без «оставьте телефон»: перевозка и утилизация отдельно по каждому полигону, расстояние по дорожной сети, актуальные статусы приёма."
    />
    <meta property="og:image" content="%SITE_ORIGIN%/preview.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Что это за страница, машинным словарём. Ни цен, ни оценок, ни
         реквизитов здесь нет: цены зависят от расчёта, а юридическое лицо
         сервиса ещё не названо заказчиком (Q-012). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "%SITE_ORIGIN%/#website",
            "url": "%SITE_ORIGIN%/",
            "name": "ИМОЛТ",
            "inLanguage": "ru-RU",
            "description": "Расчёт стоимости вывоза и утилизации отходов строительства и сноса по Москве и Московской области."
          },
          {
            "@type": "Service",
            "name": "Вывоз и утилизация отходов строительства и сноса",
            "serviceType": "Обращение с отходами строительства и сноса",
            "description": "Перевозка и утилизация считаются отдельно по каждому полигону, расстояние берётся по дорожной сети, у цен и статусов приёма названа дата актуальности.",
            "areaServed": [
              { "@type": "AdministrativeArea", "name": "Москва" },
              { "@type": "AdministrativeArea", "name": "Московская область" }
            ],
            "provider": { "@type": "Organization", "name": "ИМОЛТ", "url": "%SITE_ORIGIN%/" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Страница собирается в браузере: без сценариев показывается то же, что
         обещает описание, иначе читатель видит пустой лист. -->
    <noscript>
      <h1>ИМОЛТ — расчёт вывоза и утилизации отходов строительства и сноса</h1>
      <p>
        Сервис считает стоимость вывоза и утилизации отходов строительства и сноса по Москве и Московской области:
        перевозка и утилизация показаны отдельно по каждому полигону, расстояние берётся по дорожной сети, у цен и
        статусов приёма названа дата актуальности.
      </p>

      <h2>Что делает сервис</h2>
      <ul>
        <li>Считает цену вывоза и утилизации сразу, без обращения к менеджеру.</li>
        <li>Показывает перевозку и утилизацию отдельными суммами по каждому полигону.</li>
        <li>Берёт расстояние по дорожной сети, а не по прямой: прямая занижает плечо перевозки.</li>
        <li>Называет статус приёма полигона и дату, на которую цены и статус верны.</li>
        <li>Позволяет распределить объём между несколькими полигонами и оставить заявку на вывоз.</li>
      </ul>

      <h2>Кому он нужен</h2>
      <p>
        Прорабу и менеджеру подрядчика сноса: первому нужна цена у объекта с телефона в руке, второму — сравнение
        полигонов и коммерческое предложение за рабочим местом.
      </p>

      <p>Расчёт идёт в браузере — включите выполнение сценариев, чтобы открыть калькулятор.</p>
    </noscript>

    <!--
      Библиотека платформы MAX. Подключается файлом платформы: пакета в
      реестре пакетов у неё нет, и закрепить версию замком нельзя — это
      названо в ADR-0009 как внешняя зависимость времени выполнения.

      Ключ defer держит порядок с модулем приложения и не задерживает разбор
      разметки. Недоступность скрипта приложение не ломает: стартовых
      параметров просто нет, и главный путь расчёта проходится без личности.
    -->
    <script defer src="https://st.max.ru/js/max-web-app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
