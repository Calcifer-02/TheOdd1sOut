<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ИМОЛТ — мини-приложение</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Библиотека платформы MAX. Подключается файлом платформы: пакета в
      реестре пакетов у неё нет, и закрепить версию замком нельзя — это
      названо в ADR-0009 как внешняя зависимость времени выполнения.

      Ключ defer держит порядок с модулем приложения и не задерживает разбор
      разметки. Недоступность скрипта приложение не ломает: стартовых
      параметров просто нет, и главный путь расчёта проходится без личности.
    -->
    <script defer src="https://st.max.ru/js/max-web-app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
