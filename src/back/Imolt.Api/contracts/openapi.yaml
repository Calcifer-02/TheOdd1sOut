# Договор расчётной части сервиса ИМОЛТ.
#
# Этот файл — источник договора, а не производная кода: он написан раньше
# реализации, чтобы интерфейсная часть разрабатывалась по нему, не дожидаясь
# сервера (см. docs/architecture/ЗАПИСЬ_АРХИТЕКТУРНОГО_РЕШЕНИЯ_ADR-0003.md).
#
# Расширения у каждой операции:
#   x-область    — предметная область по ADR-0001: справочники, расчёт, сделка;
#   x-требования — требования, которые операция закрывает (реестр требований);
#   x-вопросы    — открытые вопросы, из-за которых часть поведения не определена;
#   x-экран      — экраны запроса на дизайн (ux/ЗАПРОС_НА_ДИЗАЙН.md);
#   x-состояние  — «реализовано» или «объявлено»: что уже отвечает, а что пока
#                  только описано. Поле не даёт выдать договор за работающий код.

openapi: 3.0.3

info:
  title: ИМОЛТ — расчёт вывоза и утилизации отходов
  version: 1.3.0
  description: |
    Договор расчётной части сервиса ИМОЛТ: расчёт стоимости вывоза и
    утилизации строительных отходов по Москве и Московской области, подбор
    полигонов, маршрут, коммерческое предложение и заявка.

    **Как читать.** Операции сгруппированы по трём предметным областям
    расчётной части — «Справочники», «Расчёт», «Сделка». Границы областей
    объявлены записью ADR-0001, и группировка здесь — их внешняя проекция:
    по метке `x-область` видно, какая часть системы отвечает за операцию.

    **Что уже работает.** Все операции договора помечены
    `x-состояние: реализовано` и обслуживаются службой. Пометка двигается не
    объявлением, а обработчиком: проверка
    `tests/contracts/Imolt.Contracts.Tests` сверяет перечень реализованных
    путей с тем, что служба действительно отдаёт, и падает при расхождении в
    любую сторону.

    Реализовано не значит «доступно всякому». Операции с `bearerAuth` требуют
    сессии участника, а ведение справочников — ещё и права, которое назначает
    развёртывание (ADR-0007). Пустой состав обладателей права — рабочее
    состояние: редактор справочников тогда закрыт всем.

    Мок поднимается из этого же файла, примеры ответов взяты из раздела 7
    запроса на дизайн и согласованы между собой (адрес «Москва,
    ул. Годовикова, 9», дата актуальности 17.09.2026).

    **Чего в договоре нет.** Поведение, не определённое заказчиком, не
    додумано: такие места помечены `x-вопросы` со ссылкой на открытый вопрос.
    Отложенные требования (R-047, R-062 — R-066) в версию 1 не входят.

    **Соглашения.**

    - Пути и имена полей — латиницей, тексты и описания — по-русски;
      идентификаторы кода остаются латиницей по правилам проекта.
    - Денежная сумма передаётся строкой с двумя знаками после точки: двоичная
      дробь округляет рубли по дороге, а смета этого не прощает.
    - Идентификатор непрозрачен для клиента: его форму задаёт сервер.
    - Ошибка возвращается документом `application/problem+json` (RFC 9457).
    - Расчёт предварительный: это состояние объявлено полем, а не примечанием
      в макете (R-059).
  contact:
    name: ИМОЛТ
    email: hello@imolt.com
  license:
    name: Условия использования — у владельца проекта
    url: https://имолт.рф

servers:
  - url: https://triadmind.ru/api
    description: |
      Стенд. Единственный публичный адрес службы: расчётная часть стоит
      путём на общем узле с мини-приложением, внешний узел снимает префикс
      /api (ADR-0004). Базовый адрес берётся отсюда целиком — собирать путь
      руками нельзя: на этом узле неизвестный путь вне /api отдаёт страницу
      мини-приложения с кодом 200, и ошибка выглядит как успех.
  - url: http://localhost:18080
    description: расчётная часть напрямую при локальном запуске (порт API_PORT из .env)
  - url: http://localhost:15173/api
    description: через мини-приложение при локальном запуске — nginx снимает префикс /api
  - url: http://localhost:4010
    description: мок по этому договору (prism), сервер не нужен

tags:
  - name: Служебное
    description: Живость и готовность службы. Единственное, что уже отвечает.
  - name: Справочники
    description: |
      Область «справочники» по ADR-0001: группы отходов, полигоны, адреса,
      актуальность данных и их обновление. Данные сюда пишет служба `sync`
      (ADR-0002), расчёт их только читает.
  - name: Расчёт
    description: |
      Область «расчёт» по ADR-0001: пересчёт мер, стоимость по полигонам,
      сортировка и фильтры, выбор, распределение объёма и маршрут. Формула
      живёт здесь и только здесь.
  - name: Сделка
    description: |
      Область «сделка» по ADR-0001: коммерческое предложение, заявка на вывоз,
      услуги по документации и подписка.
  - name: Доступ
    description: |
      Сессия и профиль. Личность даёт платформа MAX: в версию 1 своего входа
      по паролю или коду нет (ADR-0006). Он не отменён, а отложен требованием
      R-066 — до работы вне мессенджера или появления отправителя кода. Что
      именно закрыто подпиской — открытый вопрос Q-011, поэтому договор
      объявляет форму, а не политику.

security:
  - {}
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      tags: [Служебное]
      summary: Живость службы
      description: |
        Отвечает, пока процесс жив. Внешних зависимостей не трогает — иначе
        перезапуск базы данных выглядел бы как отказ самой службы.
      security: []
      x-область: служебное
      x-требования: [R-067]
      x-состояние: реализовано
      responses:
        '200':
          description: служба жива
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
              example: { service: api, status: ok }

  /ready:
    get:
      operationId: getReadiness
      tags: [Служебное]
      summary: Готовность службы
      description: |
        Подтверждает, что служба видит базу данных по строке подключения из
        окружения. Эта точка ловит разорванную связку api → db.
      security: []
      x-область: служебное
      x-требования: [R-068]
      x-состояние: реализовано
      responses:
        '200':
          description: служба готова обслуживать запросы
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessStatus' }
              example: { service: api, status: ready, database: reachable }
        '503':
          description: база данных недоступна или строка подключения не задана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessStatus' }
              example:
                service: api
                status: not_ready
                reason: переменная DATABASE_URL не задана

  /v1/waste-groups:
    get:
      operationId: listWasteGroups
      tags: [Справочники]
      summary: Справочник групп отходов
      description: |
        Список групп отходов с поиском по названию и коду каталога отходов. Отдаёт цену
        перевозки за тонна-километр и коэффициент плотности: по ним
        интерфейс показывает пересчёт меры, а расчёт — стоимость.
      x-область: справочники
      x-требования: [R-013, R-039, R-017, R-015]
      x-экран: [Э-01, Э-02, Э-11]
      x-состояние: реализовано
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: страница справочника
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WasteGroupPage' }
              examples:
                twoWasteGroups:
                  summary: поиск по строке «лом»
                  value:
                    items:
                      - id: beton-lom
                        name: Лом бетона и железобетона
                        fkkoCodes: ['8 22 201 01 21 5']
                        transportPricePerTonKm: { amount: '12.00', currency: RUB }
                        densityTonPerCubicMeter: 2.0
                        updatedAt: '2026-09-17'
                      - id: kirpich-lom
                        name: Лом кирпичной кладки
                        fkkoCodes: ['8 23 101 01 21 5']
                        transportPricePerTonKm: { amount: '14.00', currency: RUB }
                        densityTonPerCubicMeter: 1.5
                        updatedAt: '2026-09-17'
                    total: 2
                    limit: 10
                    offset: 0
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/waste-groups/{wasteGroupId}:
    parameters:
      - $ref: '#/components/parameters/WasteGroupIdPath'
    get:
      operationId: getWasteGroup
      tags: [Справочники]
      summary: Карточка группы отходов
      x-область: справочники
      x-требования: [R-039]
      x-экран: [Э-11]
      x-состояние: реализовано
      responses:
        '200':
          description: карточка группы
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WasteGroup' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateWasteGroup
      tags: [Справочники]
      summary: Изменить цену перевозки и плотность группы
      description: |
        Редактор цен менеджера данных. Цена перевозки вводится за
        тонна-километр по группе и умножается на километраж в расчёте —
        второго места, где она живёт, нет.

        Кто вправе править, определяет политика доступа; она пока не
        установлена (Q-011), поэтому договор объявляет требование сессии,
        а не роль.
      security:
        - bearerAuth: []
      x-область: справочники
      x-требования: [R-042, R-043, R-048]
      x-вопросы: [Q-011, Q-013]
      x-экран: [Э-11]
      x-состояние: реализовано
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WasteGroupUpdate' }
            example:
              transportPricePerTonKm: { amount: '32.00', currency: RUB }
      responses:
        '200':
          description: группа изменена, дата актуальности обновлена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WasteGroup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }

  /v1/landfills:
    get:
      operationId: listLandfills
      tags: [Справочники]
      summary: Реестр полигонов
      description: |
        Полигоны с принимаемыми группами отходов, тарифами утилизации,
        статусом и датой его актуальности. Режим «Справочник цен» в интерфейсе
        и редактор данных читают один и тот же список.
      x-область: справочники
      x-требования: [R-040, R-004, R-028, R-048, R-088]
      x-экран: [Э-03, Э-11]
      x-состояние: реализовано
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - name: wasteGroupId
          in: query
          description: оставить полигоны, принимающие эту группу отходов
          schema: { type: string }
        - name: status
          in: query
          description: оставить полигоны с этим статусом
          schema: { $ref: '#/components/schemas/LandfillStatus' }
        - name: sort
          in: query
          description: |
            Поле порядка. Порядок считает служба, а не экран: выдача
            постраничная, и список, упорядоченный на клиенте, переставил бы
            только показанную страницу (R-088).

            `tariff` упорядочивает по тарифу утилизации выбранной группы
            отходов, а без выбранной группы — по наименьшему тарифу
            полигона: полигон без тарифов идёт последним в любом направлении,
            потому что отсутствие цены — не самая низкая цена.
          schema:
            type: string
            default: name
            enum: [name, status, updatedAt, tariff]
        - name: order
          in: query
          description: направление порядка
          schema:
            type: string
            enum: [asc, desc]
            default: asc
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: страница реестра
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LandfillPage' }
              examples:
                singleLandfill:
                  summary: фильтр по группе «Лом бетона»
                  value:
                    items:
                      - id: vostok-timohovo
                        name: Комплекс переработки «Восток»
                        legalEntity: ООО «Восток»
                        address: Московская обл., Богородский г. о., д. Тимохово
                        coordinates: { latitude: 55.7286, longitude: 38.2153 }
                        status: active
                        statusUpdatedAt: '2026-09-17'
                        tariffs:
                          - wasteGroupId: beton-lom
                            disposalPricePerTon: { amount: '450.00', currency: RUB }
                            updatedAt: '2026-09-17'
                    total: 1
                    limit: 10
                    offset: 0
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/landfills/{landfillId}:
    parameters:
      - $ref: '#/components/parameters/LandfillIdPath'
    get:
      operationId: getLandfill
      tags: [Справочники]
      summary: Карточка полигона
      description: |
        Карточка хранит историю смены юридического лица: тарифы и статусы
        при смене владельца не теряются (R-041).
      x-область: справочники
      x-требования: [R-040, R-041]
      x-экран: [Э-11]
      x-состояние: реализовано
      responses:
        '200':
          description: карточка полигона
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LandfillCard' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/landfills/{landfillId}/tariffs/{wasteGroupId}:
    parameters:
      - $ref: '#/components/parameters/LandfillIdPath'
      - $ref: '#/components/parameters/WasteGroupIdPath'
    put:
      operationId: setLandfillTariff
      tags: [Справочники]
      summary: Задать тариф утилизации полигона по группе отходов
      description: |
        Ячейка таблицы «полигон x группа отходов» в редакторе. Запись
        обновляет дату актуальности тарифа: расчёт показывает её пользователю.
      security:
        - bearerAuth: []
      x-область: справочники
      x-требования: [R-042, R-048]
      x-вопросы: [Q-011]
      x-экран: [Э-11]
      x-состояние: реализовано
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LandfillTariffUpdate' }
            example:
              disposalPricePerTon: { amount: '480.00', currency: RUB }
      responses:
        '200':
          description: тариф задан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LandfillTariff' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }

  /v1/landfills/{landfillId}/status:
    parameters:
      - $ref: '#/components/parameters/LandfillIdPath'
    put:
      operationId: setLandfillStatus
      tags: [Справочники]
      summary: Задать статус полигона вручную
      description: |
        Запасной путь к автоматическому обновлению из Telegram-канала: когда
        сообщение не распознано или источник недоступен, статус ставит
        менеджер данных. Ни один внешний источник не обязателен — инвариант 4
        записи ADR-0002.
      security:
        - bearerAuth: []
      x-область: справочники
      x-требования: [R-044, R-028, R-048]
      x-вопросы: [Q-011, Q-013]
      x-экран: [Э-11]
      x-состояние: реализовано
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LandfillStatusUpdate' }
            example:
              status: active
              reason: подтверждено по телефону
      responses:
        '200':
          description: статус задан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LandfillStatusState' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/landfills/{landfillId}/reviews:
    parameters:
      - $ref: '#/components/parameters/LandfillIdPath'
    get:
      operationId: listLandfillReviews
      tags: [Справочники]
      summary: Отзывы и оценки полигона
      description: |
        Оценки пользователей — обратная связь по актуальности данных, а не
        рейтинг услуги: расхождение цены или статуса с действительностью
        видно раньше, чем его заметит менеджер данных (риск AR-002).

        Экрана под эту возможность в запросе на дизайн пока нет.
      x-область: справочники
      x-требования: [R-031]
      x-состояние: реализовано
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: страница отзывов
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LandfillReviewPage' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createLandfillReview
      tags: [Справочники]
      summary: Оставить оценку и отзыв о полигоне
      security:
        - bearerAuth: []
      x-область: справочники
      x-требования: [R-031, R-048]
      x-вопросы: [Q-011]
      x-состояние: реализовано
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LandfillReviewInput' }
            example:
              rating: 2
              text: тариф на месте оказался 520 ₽/т вместо 480 ₽/т
      responses:
        '201':
          description: отзыв принят
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LandfillReview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }

  /v1/address-suggestions:
    get:
      operationId: suggestAddresses
      tags: [Справочники]
      summary: Подсказки адреса вывоза
      description: |
        Подсказки приходят через сервер, а не из браузера: ключ доступа к
        внешней службе остаётся на сервере (R-056, риск AR-006). Принимаются
        только адреса Москвы и Московской области и только с координатами —
        без них расстояние не посчитать.
      x-область: справочники
      x-требования: [R-012, R-055, R-056]
      x-вопросы: [Q-014]
      x-экран: [Э-01]
      x-состояние: реализовано
      parameters:
        - name: query
          in: query
          required: true
          description: начало адреса, не короче трёх символов
          schema: { type: string, minLength: 3, maxLength: 200 }
          example: Годовикова 9
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: подсказки, пригодные для расчёта
          content:
            application/json:
