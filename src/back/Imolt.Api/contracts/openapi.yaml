  /v1/reference-imports:
    post:
      operationId: startReferenceImport
      tags: [Справочники]
      summary: Загрузить справочник из файла и получить предпросмотр
      description: |
        Импорт двухшаговый: загрузка возвращает предпросмотр с расхождениями,
        и только подтверждение меняет справочник. Молчаливая перезапись цен
        файлом — не то, что откатывается взглядом.

        ## Схема книги, версия 1

        Формат — XLSX. Читается **только первый лист**; соседние листы с
        примечаниями не читаются, потому что применить то, чего никто не
        показывал, хуже, чем не применить ничего.

        Строка 1 — заголовки. Столбец выбирается по заголовку без учёта
        регистра и обрамляющих пробелов; хвост после запятой считается единицей
        измерения для человека, поэтому «Цена перевозки, руб/т·км» и «цена
        перевозки» — один столбец. Незнакомый заголовок не ошибка: столбец
        просто не читается.

        | `kind` | ключ записи | изменяемые столбцы |
        |---|---|---|
        | `wasteGroups` | «Идентификатор» | «Название», «Цена перевозки», «Плотность» |
        | `landfills` | «Идентификатор» | «Название», «Юрлицо», «Адрес» |
        | `tariffs` | «Полигон» и «Группа отходов» | «Цена утилизации» |

        Поле `entityId` предпросмотра равно ключу; у тарифа ключ составной и
        записывается как `полигон/группа`. Поле `field` называет поле **этого
        договора** (`transportPricePerTonKm`, `disposalPricePerTon` и прочие),
        а не заголовок столбца книги.

        Числа читаются русской локалью: разделителем дробной части годятся и
        запятая, и точка, разделители разрядов отбрасываются. Цены
        неотрицательны.

        ## Чего импорт не делает

        **Не заводит новые записи.** Строка, ссылающаяся на запись, которой в
        справочнике нет, попадает в `rejectedRows`. Реестр полигонов
        пополняется из официального перечня (R-046), а не книгой.

        **Не применяет коды ФККО.** Столбец «Коды ФККО» распознаётся, но его
        значения не записываются: редакция каталога не сверена (Q-015).
        Причина называется в `rejectedRows` — молча пропущенный столбец
        читается как «импортировалось».

        **Не доверяет формулам.** Ячейка с формулой отвергается вместе с её
        сохранённым значением: это значение посчитал не сервис.

        Значение, совпадающее с текущим, расхождением не считается и в
        `changes` не попадает — иначе повторная загрузка той же книги
        отчиталась бы о тех же изменениях второй раз.

        Номер в `rejectedRows[].row` — номер строки листа, как его показывает
        редактор таблиц: данные начинаются со строки 2.

        Пределы: файл до 2 МиБ (иначе `415`), лист до 5000 строк (иначе `422`).
      security:
        - bearerAuth: []
      x-область: справочники
      x-требования: [R-045, R-042]
      x-вопросы: [Q-011, Q-014]
      x-экран: [Э-11]
      x-состояние: реализовано
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ReferenceImportUpload' }
      responses:
        '201':
          description: файл разобран, изменения показаны без применения
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferenceImportPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }

