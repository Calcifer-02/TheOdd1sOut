      description: Раздел «Расчёты» личного кабинета. Гостю недоступен.
      security:
        - bearerAuth: []
      x-область: расчёт
      x-требования: [R-049, R-008]
      x-вопросы: [Q-011]
      x-экран: [Э-10]
      x-состояние: реализовано
      parameters:
        - $ref: '#/components/parameters/Limit'
