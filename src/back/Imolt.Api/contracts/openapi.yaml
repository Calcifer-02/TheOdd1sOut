  /v1/calculations:
    post:
      operationId: createCalculation
      tags: [Расчёт]
      summary: Рассчитать стоимость вывоза и утилизации
      description: |
        Главная операция сервиса. Принимает адрес вывоза с координатами, один
        или несколько типов отходов с объёмом и мерой, признак утилизации и
        фильтр расстояния. Возвращает по каждой группе отходов список
        полигонов со стоимостью перевозки, утилизации и итогом.

        Стоимость считается так: перевозка = объём в тоннах x цена группы за
        тонна-километр x расстояние по дорожной сети; утилизация = объём в
        тоннах x тариф полигона по этой группе (R-018). Ни коэффициенты, ни
        формула наружу не отдаются (R-058): клиент получает результат и его
        составляющие.

        Первая страница — 10 полигонов (R-029, R-060), остальные берутся
        операцией `listPlacementOptions`.

        Расчёт предварительный: поле `preliminary` истинно всегда, а
        допустимое отклонение финальной цены пока не задано (Q-010).
      x-область: расчёт
      x-требования: [R-002, R-003, R-018, R-019, R-020, R-021, R-022, R-058, R-059, R-060]
      x-вопросы: [Q-008, Q-010]
      x-экран: [Э-01, Э-02, Э-03, Э-12]
      x-состояние: реализовано
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CalculationRequest' }
            examples:
              twoWasteGroups:
                summary: путь UC-001 — бетон 20 т и древесина 15 м³
                value:
                  pickupAddress:
                    suggestionId: dadata-77-godovikova-9
                    value: г Москва, ул Годовикова, д 9
                    coordinates: { latitude: 55.8055, longitude: 37.6206 }
                  items:
                    - wasteGroupId: beton-lom
                      quantity: { value: 20, unit: t }
                    - wasteGroupId: drevesina
                      quantity: { value: 15, unit: m3 }
                  disposalRequired: true
                  distanceFilter: { mode: atMost, km: 60 }
      responses:
        '201':
          description: расчёт выполнен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Calculation' }
              examples:
                concreteResult:
                  $ref: '#/components/examples/ConcreteCalculation'
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/AddressOutsideServiceArea' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }
    get:
      operationId: listCalculations
      tags: [Расчёт]
