      summary: Сформировать коммерческое предложение
      description: |
        Кнопка «Скачать КП». Операция закрепляет цены на момент выпуска и
        возвращает ссылку на документ: сам PDF отдаёт `downloadQuoteDocument`.
        Разделение намеренное — повторное скачивание не должно выпускать
        второе предложение с другим номером.

        Срок действия цены печатается в документе, но его длительность и
        допустимое отклонение финальной цены заказчиком не названы (Q-010),
        как и реквизиты оформления (Q-012).
      x-область: сделка
      x-требования: [R-006, R-036, R-037, R-038, R-059]
      x-вопросы: [Q-010, Q-012]
      x-экран: [Э-07]
      x-состояние: реализовано
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteRequest' }
            example:
              customerName: ООО «Подрядчик»
      responses:
        '201':
          description: предложение выпущено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
              example:
                id: 0b6a8f4e-3a1d-4f2e-9d55-2f1c8a0b7e31
                number: КП-2026-0917-014
                issuedAt: '2026-09-17T12:04:00+03:00'
                validUntil: '2026-09-24'
                total: { amount: '39880.00', currency: RUB }
                preliminary: true
                documentUrl: /v1/quotes/0b6a8f4e-3a1d-4f2e-9d55-2f1c8a0b7e31/document
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }

  /v1/quotes/{quoteId}/document:
    parameters:
      - name: quoteId
        in: path
        required: true
        description: идентификатор коммерческого предложения
        schema: { type: string }
    get:
      operationId: downloadQuoteDocument
      tags: [Сделка]
      summary: Скачать коммерческое предложение
      description: |
        Документ на одном листе A4 со всем составом расчёта: адрес вывоза,
        типы отходов, количество и мера, цены за единицу, перевозка,
        утилизация, итог, срок действия и пометка о предварительности цены.
      x-область: сделка
      x-требования: [R-036, R-037, R-038, R-059, R-061]
      x-вопросы: [Q-012]
      x-экран: [Э-07]
      x-состояние: реализовано
      responses:
        '200':
          description: файл предложения
          content:
            application/pdf:
              schema: { type: string, format: binary }
          headers:
            Content-Disposition:
              description: имя файла для автоматического скачивания
              schema: { type: string }
              example: attachment; filename="КП-2026-0917-014.pdf"
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/pickup-requests:
    post:
      operationId: createPickupRequest
      tags: [Сделка]
      summary: Отправить заявку на вывоз
      description: |
        Карточка заявки под результатами расчёта. Заявка передаётся менеджеру
        ИМОЛТ; сейчас форма на сайте пишет только в консоль браузера (риск
        AR-008), и эта операция закрывает разрыв.

        Согласие на обработку персональных данных обязательно: без него
        операция отвечает 422 и заявку не создаёт (R-054).
      x-область: сделка
      x-требования: [R-009, R-053, R-054]
      x-экран: [Э-08]
      x-состояние: реализовано
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PickupRequestInput' }
            example:
              calculationId: 5f0a1c2b-77d9-4f61-9a6f-9c3d1b2a8e40
              landfillId: vostok-timohovo
              contactName: Иван
              phone: '+79161234567'
              personalDataConsent: true
      responses:
        '201':
          description: заявка принята
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PickupRequest' }
              example:
                id: 3c1f9a77-2b64-4f0a-8f2d-77b1c9e5a012
                createdAt: '2026-09-17T12:10:00+03:00'
                state: accepted
                message: Заявка принята, менеджер свяжется в течение рабочего дня
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }

  /v1/document-services:
    get:
      operationId: listDocumentServices
      tags: [Сделка]
      summary: Каталог услуг по документации
      description: |
        Разрешение ОССиГ, ордер ОАТИ, ППР и ПОД, лабораторные исследования и
        паспорта отходов, биотестирование. Цена указывается как «от» либо
        отсутствует — тогда `priceOnRequest` истинно.

        Состав пакета и логика выборочного заказа заказчиком не подтверждены
        (Q-005): каталог отдаётся как данные, а не зашивается в интерфейс.
      x-область: сделка
      x-требования: [R-052]
      x-вопросы: [Q-005]
      x-экран: [Э-10]
      x-состояние: реализовано
      responses:
        '200':
          description: каталог услуг
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentServicePage' }
              example:
                items:
                  - id: ossig-mo
                    name: Разрешение на перемещение ОССиГ (Московская область)
                    priceFrom: { amount: '50000.00', currency: RUB }
                    priceOnRequest: false
                  - id: laboratory
                    name: Лабораторные исследования и паспорта отходов
                    priceFrom: null
                    priceOnRequest: true
                total: 2
                limit: 10
                offset: 0

  /v1/document-service-orders:
    post:
      operationId: createDocumentServiceOrder
      tags: [Сделка]
      summary: Заказать услугу по документации
      x-область: сделка
      x-требования: [R-009, R-052, R-054]
      x-вопросы: [Q-005, Q-011]
      x-экран: [Э-10]
      x-состояние: реализовано
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentServiceOrderInput' }
            example:
              serviceId: ossig-mo
              objectAddress: г Москва, ул Годовикова, д 9
              comment: снос ангара, начало работ 01.10.2026
              personalDataConsent: true
      responses:
        '201':
          description: заказ принят
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentServiceOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }

  /v1/subscription-requests:
    post:
      operationId: createSubscriptionRequest
      tags: [Сделка]
      summary: Оставить заявку на подписку
      description: |
        Оплата вне сервиса: операция фиксирует намерение и переводит подписку
        в состояние «ожидает подтверждения». Тарифы и пробный период
        заказчиком не названы (Q-004), поэтому цена в договоре не объявляется.
      security:
        - bearerAuth: []
      x-область: сделка
      x-требования: [R-008, R-049]
      x-вопросы: [Q-004, Q-011]
      x-экран: [Э-09]
      x-состояние: реализовано
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionRequestInput' }
            example:
              role: carrier
              companyName: ООО «Перевозчик»
              inn: '7701234567'
              registeredInAisOssig: true
      responses:
        '201':
          description: заявка на подписку принята
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }

  /v1/auth/sessions:
    post:
      operationId: createSession
      tags: [Доступ]
      summary: Обменять параметры запуска MAX на сессию
      description: |
        Личность даёт платформа: мини-приложение передаёт сюда строку
        стартовых параметров `initData`, сервер проверяет её подпись ключом
        бота и в ответ выдаёт маркер доступа для заголовка
        `Authorization: Bearer` (ADR-0006). Пароль, телефон и код
        подтверждения здесь не передаются: собственный вход отложен
        требованием R-066 и в версию 1 не входит.

        Подпись проверяется на сервере: ключ бота наружу не выходит (R-056).
        Срок жизни маркера объявлен полем: клиент не угадывает его по опыту.
      security: []
      x-область: сделка
      x-требования: [R-049, R-050, R-051, R-054]
      x-вопросы: [Q-011]
      x-экран: [Э-09]
      x-состояние: реализовано
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SessionRequest' }
            example:
              initData: 'auth_date=1758067200&query_id=AAH…&user=%7B%22id%22%3A812345%7D&hash=0f3c…'
              personalDataConsent: true
      responses:
        '201':
          description: сессия создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.пример.пример
                expiresIn: 86400
                profile:
                  id: 9d3a7c10-52f4-4a1b-9ad8-0f6c2b5e41aa
                  maxUserId: '812345'
                  displayName: Иван
                  role: carrier
                  companyName: ООО «Перевозчик»
                  subscription: { state: pending }
        '401':
          description: подпись параметров запуска не сошлась или они устарели
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/UnprocessableContent' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /v1/profile:
    get:
      operationId: getProfile
      tags: [Доступ]
      summary: Профиль и состояние подписки
      description: |
        Кабинет показывает по этой операции пометку «Подписка ожидает
        подтверждения». Признак регистрации транспорта в АИС ОССиГ хранится
        в профиле перевозчика (R-051).
      security:
        - bearerAuth: []
      x-область: сделка
      x-требования: [R-049, R-050, R-051]
      x-вопросы: [Q-011]
      x-экран: [Э-10]
      x-состояние: реализовано
      responses:
        '200':
          description: профиль
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Маркер сессии из операции `createSession`. Расчёт и коммерческое
        предложение задуманы доступными без входа; окончательный перечень
        закрытых операций — открытый вопрос Q-011.

  parameters:
    SearchQuery:
      name: query
      in: query
      description: 'поиск по названию; для групп отходов — ещё и по коду каталога отходов'
      required: false
      schema: { type: string, maxLength: 200 }
    Limit:
      name: limit
      in: query
      description: |
        Сколько записей вернуть. По умолчанию 10: первый экран результатов
        показывает десять полигонов, остальные догружаются (R-029, R-060).
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    Offset:
      name: offset
      in: query
      description: сколько записей пропустить
      required: false
      schema: { type: integer, minimum: 0, default: 0 }
    WasteGroupIdPath:
      name: wasteGroupId
      in: path
      required: true
      description: идентификатор группы отходов
      schema: { type: string }
      example: beton-lom
    LandfillIdPath:
      name: landfillId
      in: path
      required: true
      description: идентификатор полигона
      schema: { type: string }
      example: vostok-timohovo
    CalculationIdPath:
      name: calculationId
      in: path
      required: true
      description: идентификатор расчёта
      schema: { type: string }
      example: 5f0a1c2b-77d9-4f61-9a6f-9c3d1b2a8e40

  responses:
    BadRequest:
      description: запрос не разобран или параметр вне допустимых значений
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: 'urn:imolt:problem:validation'
            title: Запрос не прошёл проверку
            status: 400
            detail: Параметр limit должен быть от 1 до 100
    NotFound:
      description: запись не найдена
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: 'urn:imolt:problem:not-found'
            title: Запись не найдена
            status: 404
    Unauthorized:
      description: операция требует входа
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: 'urn:imolt:problem:authentication-required'
            title: Нужен вход
            status: 401
    Forbidden:
      description: |
        Сессия есть, но операция закрыта. Причин две, и они различаются кодом,
        потому что различаются и действия пользователя:

        - `urn:imolt:problem:subscription-required` — возможность закрыта
          подпиской; пользователь оформляет её сам. Перечень закрытых подпиской
          операций не установлен — Q-011;
        - `urn:imolt:problem:role-required` — у участника нет права на эту
          операцию; выдать право может только владелец данных, и сам участник
          ничего с этим не сделает (ADR-0007).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            подписка:
              value:
                type: 'urn:imolt:problem:subscription-required'
                title: Детали доступны по подписке
                status: 403
            право:
              value:
                type: 'urn:imolt:problem:role-required'
                title: Операция доступна менеджеру данных
                status: 403
                detail: Ведение справочников закреплено за владельцем данных
    UnprocessableContent:
      description: запрос разобран, но нарушает правило предметной области
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: 'urn:imolt:problem:allocation-mismatch'
            title: Распределение не сходится с объёмом
            status: 422
            detail: По группе «Лом бетона» распределено 18 т из 20 т
            errors:
              - field: entries[1].quantity.value
                message: увеличьте на 2 т либо уменьшите объём группы
    AddressOutsideServiceArea:
      description: |
        Адрес вывоза вне Москвы и Московской области либо без координат.
        Расчёт не запускается, поле подсвечивается (R-012).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: 'urn:imolt:problem:address-outside-service-area'
            title: Адрес вне зоны обслуживания
            status: 422
            detail: Сервис считает вывоз по Москве и Московской области
    UpstreamUnavailable:
      description: |
        Внешняя служба расстояний или подсказок не ответила либо исчерпан
        лимит обращений (риск AR-007). Сохранённые данные при этом остаются
        доступны: отказ источника не равен отказу обслуживания.
      headers:
        Retry-After:
          description: через сколько секунд повторить
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: 'urn:imolt:problem:distance-service-unavailable'
            title: Не удалось рассчитать расстояния
            status: 503
            detail: Повторите попытку
    UnsupportedMediaType:
      description: формат загруженного файла не поддерживается
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: 'urn:imolt:problem:unsupported-media-type'
            title: Формат файла не поддерживается
            status: 415
    Conflict:
      description: состояние записи изменилось, и запрос к нему больше не применим
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: 'urn:imolt:problem:stale-preview'
            title: Предпросмотр устарел
            status: 409
            detail: Справочник изменился после разбора файла, разберите его заново
    TooManyRequests:
      description: обращения идут чаще допустимого
      headers:
        Retry-After:
          description: через сколько секунд повторить
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: 'urn:imolt:problem:too-many-requests'
            title: Слишком частые обращения
            status: 429

  examples:
    ConcreteCalculation:
      summary: расчёт UC-001 — первая страница по группе «Лом бетона»
      value:
        id: 5f0a1c2b-77d9-4f61-9a6f-9c3d1b2a8e40
        createdAt: '2026-09-17T12:00:00+03:00'
        preliminary: true
        pickupAddress:
          value: г Москва, ул Годовикова, д 9
          coordinates: { latitude: 55.8055, longitude: 37.6206 }
          area: moscow
        measure: t
        disposalRequired: true
        distanceFilter: { mode: atMost, km: 60 }
        dataFreshness:
          pricesUpdatedAt: '2026-09-17'
          statusesUpdatedAt: '2026-09-17'
          landfillsWithStaleData: 1
        items:
          - wasteGroupId: beton-lom
            wasteGroupName: Лом бетона и железобетона
            input: { value: 20, unit: t }
            calculated: { value: 20, unit: t }
            tons: 20
          - wasteGroupId: drevesina
            wasteGroupName: Древесина от разборки
            input: { value: 15, unit: m3 }
            calculated: { value: 7.5, unit: t }
            tons: 7.5
        results:
          - wasteGroupId: beton-lom
            options:
              items:
                - landfillId: vostok-timohovo
                  landfillName: Комплекс переработки «Восток»
                  address: Московская обл., Богородский г. о., д. Тимохово
                  distanceKm: 45
                  transportCost: { amount: '10800.00', currency: RUB }
                  disposalCost: { amount: '9000.00', currency: RUB }
                  totalCost: { amount: '19800.00', currency: RUB }
                  status: active
                  statusUpdatedAt: '2026-09-17'
                - landfillId: iksha
                  landfillName: Площадка «Икша»
                  address: Московская обл., Дмитровский г. о., пос. Икша
                  distanceKm: 52
                  transportCost: { amount: '12480.00', currency: RUB }
                  disposalCost: { amount: '7600.00', currency: RUB }
                  totalCost: { amount: '20080.00', currency: RUB }
                  status: active
                  statusUpdatedAt: '2026-09-17'
              total: 5
              limit: 10
              offset: 0
              emptyReason: null

  schemas:

    Money:
      type: object
      description: |
        Денежная сумма. Передаётся строкой с двумя знаками после точки:
        двоичная дробь округляет рубли по дороге, а смета этого не прощает.
        Форматирование по локали ru-RU — работа интерфейса (R-061).
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^-?[0-9]+\.[0-9]{2}$'
          example: '19800.00'
        currency:
          type: string
          enum: [RUB]
      additionalProperties: false

    Unit:
      type: string
      description: мера объёма отходов — тонны либо кубические метры
      enum: [t, m3]

    Quantity:
      type: object
      required: [value, unit]
      properties:
        value: { type: number, format: double, minimum: 0, example: 20 }
        unit: { $ref: '#/components/schemas/Unit' }
      additionalProperties: false

    Coordinates:
      type: object
      description: координаты точки; без них расстояние по дорожной сети не считается
      required: [latitude, longitude]
      properties:
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }
      additionalProperties: false

    ServiceArea:
      type: string
      description: зона обслуживания, к которой относится адрес
      enum: [moscow, moscowRegion]

    HealthStatus:
      type: object
      required: [service, status]
      properties:
        service: { type: string, example: api }
        status: { type: string, enum: [ok] }

    ReadinessStatus:
      type: object
      required: [service, status]
      properties:
        service: { type: string, example: api }
        status: { type: string, enum: [ready, not_ready] }
        database: { type: string, enum: [reachable] }
        reason:
          type: string
          description: причина неготовности; присутствует только при not_ready

    Problem:
      type: object
      description: |
        Описание ошибки по RFC 9457. Поле `type` — устойчивый код причины:
        интерфейс ветвится по нему, а не по тексту заголовка.
      required: [type, title, status]
      properties:
        type: { type: string, example: 'urn:imolt:problem:validation' }
        title: { type: string, example: Запрос не прошёл проверку }
        status: { type: integer, example: 400 }
        detail: { type: string }
        instance: { type: string, description: 'путь запроса, на котором возникла ошибка' }
        errors:
          type: array
          description: разбор по полям — для форм
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    Page:
      type: object
      description: общая часть страничного ответа
      required: [total, limit, offset]
      properties:
        total: { type: integer, description: сколько записей всего подходит под запрос }
        limit: { type: integer }
        offset: { type: integer }

    WasteGroup:
      type: object
      description: |
        Группа отходов справочника: название, коды ФККО, цена перевозки за
        тонна-километр и коэффициент плотности для пересчёта меры.
      required: [id, name, fkkoCodes, transportPricePerTonKm, densityTonPerCubicMeter, updatedAt]
      properties:
        id: { type: string, example: beton-lom }
        name: { type: string, example: Лом бетона и железобетона }
        fkkoCodes:
          type: array
          items: { type: string }
          example: ['8 22 201 01 21 5']
        transportPricePerTonKm: { $ref: '#/components/schemas/Money' }
        densityTonPerCubicMeter: { type: number, format: double, example: 2.0 }
        updatedAt: { type: string, format: date, example: '2026-09-17' }

    WasteGroupPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/WasteGroup' }

    WasteGroupUpdate:
      type: object
      description: изменяется то, что передано; непереданное остаётся прежним
      minProperties: 1
      properties:
        name: { type: string }
        fkkoCodes:
          type: array
          items: { type: string }
        transportPricePerTonKm: { $ref: '#/components/schemas/Money' }
        densityTonPerCubicMeter: { type: number, format: double, minimum: 0 }
      additionalProperties: false

    LandfillStatus:
      type: string
      description: |
        Состояние полигона: принимает отходы, заблокирован либо не подтверждён.
        `unconfirmed` — когда сообщение источника не распознано и статус не
        подтверждён вручную.
      enum: [active, blocked, unconfirmed]

    LandfillTariff:
      type: object
      required: [wasteGroupId, disposalPricePerTon, updatedAt]
      properties:
        wasteGroupId: { type: string, example: beton-lom }
        disposalPricePerTon: { $ref: '#/components/schemas/Money' }
        updatedAt: { type: string, format: date, example: '2026-09-17' }

    LandfillTariffUpdate:
      type: object
      required: [disposalPricePerTon]
      properties:
        disposalPricePerTon: { $ref: '#/components/schemas/Money' }
      additionalProperties: false

    Landfill:
      type: object
      required: [id, name, address, coordinates, status, statusUpdatedAt, tariffs]
      properties:
        id: { type: string, example: vostok-timohovo }
        name: { type: string, example: Комплекс переработки «Восток» }
        legalEntity: { type: string, example: ООО «Восток» }
        address: { type: string }
        coordinates: { $ref: '#/components/schemas/Coordinates' }
        status: { $ref: '#/components/schemas/LandfillStatus' }
        statusUpdatedAt: { type: string, format: date }
        tariffs:
          type: array
          description: тарифы утилизации по принимаемым группам отходов
          items: { $ref: '#/components/schemas/LandfillTariff' }

    LandfillPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Landfill' }

    LandfillCard:
      allOf:
        - $ref: '#/components/schemas/Landfill'
        - type: object
          properties:
            legalEntityHistory:
              type: array
              description: смены юридического лица без потери тарифов и статусов (R-041)
              items:
                type: object
                required: [legalEntity, since]
                properties:
                  legalEntity: { type: string }
                  since: { type: string, format: date }
                  until: { type: string, format: date, nullable: true }

    LandfillStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/LandfillStatus' }
        reason: { type: string, description: основание ручного изменения }
      additionalProperties: false

    LandfillStatusState:
      type: object
      required: [landfillId, status, statusUpdatedAt, source]
      properties:
        landfillId: { type: string }
        status: { $ref: '#/components/schemas/LandfillStatus' }
        statusUpdatedAt: { type: string, format: date }
        source:
          type: string
          description: откуда взят статус
          enum: [telegram, manual, registry]
        reason: { type: string }

    AddressSuggestion:
      type: object
      required: [id, value, coordinates, area]
      properties:
        id: { type: string, description: идентификатор подсказки внешней службы }
        value: { type: string, example: 'г Москва, ул Годовикова, д 9' }
        coordinates: { $ref: '#/components/schemas/Coordinates' }
        area: { $ref: '#/components/schemas/ServiceArea' }

    AddressSuggestionPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AddressSuggestion' }

    PickupAddress:
      type: object
      description: |
        Адрес вывоза. Принимается только выбранный из подсказок: расчёт
        опирается на координаты, а не на набранную строку.
      required: [value, coordinates]
      properties:
        suggestionId: { type: string }
        value: { type: string }
        coordinates: { $ref: '#/components/schemas/Coordinates' }
        area: { $ref: '#/components/schemas/ServiceArea' }

    DataFreshness:
      type: object
      description: даты последнего обновления цен и статусов (R-048)
      required: [pricesUpdatedAt, statusesUpdatedAt]
      properties:
        pricesUpdatedAt: { type: string, format: date }
        statusesUpdatedAt: { type: string, format: date }
        landfillsWithStaleData:
          type: integer
          description: сколько полигонов показывают данные старше последнего обновления

    SyncRun:
      type: object
      description: итог прогона службы сбора `sync` (ADR-0002)
      required: [startedAt, source, outcome]
      properties:
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        source:
          type: string
          enum: [telegram, file, registry]
        outcome:
          type: string
          description: |
            `succeeded` — прогон завершён; `partial` — часть источников не
            ответила; `failed` — прогон не состоялся. Отказ сбора не является
            отказом обслуживания.
          enum: [succeeded, partial, failed]
        recognizedMessages: { type: integer }
        updatedLandfills: { type: integer }
        failureReason: { type: string, nullable: true }

    ReferenceImportUpload:
      type: object
      required: [file, kind]
      properties:
        file: { type: string, format: binary, description: 'книга Excel либо выгрузка каталога отходов' }
        kind:
          type: string
          description: какой справочник загружается
          enum: [wasteGroups, landfills, tariffs]

    ReferenceImportPreview:
      type: object
      description: разобранный файл до применения — расхождения видны до записи
      required: [id, kind, changes]
      properties:
        id: { type: string }
        kind: { type: string, enum: [wasteGroups, landfills, tariffs] }
        changes:
          type: array
          items:
            type: object
            required: [entityId, field, currentValue, fileValue]
            properties:
              entityId: { type: string }
              field: { type: string }
              currentValue: { type: string, nullable: true }
              fileValue: { type: string }
        rejectedRows:
          type: array
          description: строки, которые не разобраны; они не применяются
          items:
            type: object
            required: [row, reason]
            properties:
              row: { type: integer }
              reason: { type: string }
        additions:
          type: array
          description: |
            Записи, которых в справочнике нет и которые заведёт подтверждение
            (R-046). Их поля перечислены в changes с пустым currentValue:
            «поля ещё нет» и «записи ещё нет» — разные вещи, и вторую
            менеджер данных обязан видеть до применения. Новые записи заводит
            только справочник полигонов.
          items: { type: string }

    ReferenceImportResult:
      type: object
      required: [id, appliedChanges, addedEntities, updatedAt]
      properties:
        id: { type: string }
        appliedChanges: { type: integer }
        addedEntities:
          type: integer
          description: сколько записей заведено подтверждением (R-046)
        updatedAt: { type: string, format: date-time }

    AmountConversionRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [wasteGroupId, quantity]
            properties:
              wasteGroupId: { type: string }
              quantity: { $ref: '#/components/schemas/Quantity' }

    AmountConversionResult:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [wasteGroupId, input, tons, cubicMeters, densityTonPerCubicMeter]
            properties:
              wasteGroupId: { type: string }
              input: { $ref: '#/components/schemas/Quantity' }
              tons: { type: number, format: double }
              cubicMeters: { type: number, format: double }
              densityTonPerCubicMeter: { type: number, format: double }

    DistanceFilter:
      type: object
      description: |
        Фильтр расстояния «до N км» либо «не менее N км». По умолчанию
        «до 50 км» (R-025, R-026).
      required: [mode, km]
      properties:
        mode: { type: string, enum: [atMost, atLeast], default: atMost }
        km: { type: integer, minimum: 0, maximum: 1000, default: 50 }
      additionalProperties: false

    CalculationRequest:
      type: object
      required: [pickupAddress, items]
      properties:
        pickupAddress: { $ref: '#/components/schemas/PickupAddress' }
        items:
          type: array
          minItems: 1
          maxItems: 20
          description: типы отходов расчёта; в одном расчёте их может быть несколько
          items:
            type: object
            required: [wasteGroupId, quantity]
            properties:
              wasteGroupId: { type: string }
              quantity: { $ref: '#/components/schemas/Quantity' }
        disposalRequired:
          type: boolean
          default: true
          description: |
            Флажок «Нужна утилизация на полигоне». Когда ложно, совокупная
            цена состоит только из перевозки (R-021).
        distanceFilter: { $ref: '#/components/schemas/DistanceFilter' }
      additionalProperties: false

    CalculationItem:
      type: object
      required: [wasteGroupId, wasteGroupName, input, calculated, tons]
      properties:
        wasteGroupId: { type: string }
        wasteGroupName: { type: string }
        input: { $ref: '#/components/schemas/Quantity' }
        calculated:
          allOf: [{ $ref: '#/components/schemas/Quantity' }]
          description: |
            Объём в мере расчёта — той, которую задала зона адреса вывоза
            (R-016). С введённым совпадает только тогда, когда меры совпали.
        tons:
          type: number
          format: double
          description: объём в тоннах — мера, в которой считается стоимость

    PlacementOption:
      type: object
      description: |
        Вариант размещения: полигон со стоимостью перевозки, утилизации и
        итогом по одной группе отходов.
      required: [landfillId, landfillName, address, distanceKm, transportCost, totalCost, status, statusUpdatedAt]
      properties:
        landfillId: { type: string }
        landfillName: { type: string }
        address: { type: string }
        distanceKm:
          type: number
          format: double
          description: плечо перевозки — расстояние по автомобильной дорожной сети, не по прямой (R-020)
        transportCost: { $ref: '#/components/schemas/Money' }
        disposalCost:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          nullable: true
          description: отсутствует, когда утилизация выключена (R-021)
        totalCost: { $ref: '#/components/schemas/Money' }
        status: { $ref: '#/components/schemas/LandfillStatus' }
        statusUpdatedAt: { type: string, format: date }

    PlacementOptionPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/PlacementOption' }
            emptyReason:
              type: string
              nullable: true
              description: |
                Почему список пуст. `noLandfillsForWasteGroup` — эту группу не
                принимает ни один полигон; `filteredOutByDistance` — все
                отсеяны фильтром расстояния. Пустой список ошибкой не является.
              enum: [noLandfillsForWasteGroup, filteredOutByDistance, null]

    Calculation:
      type: object
      description: |
        Расчёт целиком: исходные данные, пересчитанные объёмы, результаты по
        каждой группе отходов, выбор и распределение. Хранит дату
        актуальности данных, на которых посчитан (R-048).
      required: [id, createdAt, preliminary, pickupAddress, measure, disposalRequired, items, results, dataFreshness]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        preliminary:
          type: boolean
          description: |
            Расчёт предварительный всегда (R-059). Допустимое отклонение
            финальной цены заказчиком не названо — Q-010.
        pickupAddress: { $ref: '#/components/schemas/PickupAddress' }
        measure:
          allOf: [{ $ref: '#/components/schemas/Unit' }]
          description: |
            Мера расчёта: по Москве — тонны, по Московской области —
            кубические метры (R-016). Задаётся зоной адреса вывоза, а не
            запросом; стоимость в обеих зонах считается по тоннам (R-018).
        disposalRequired: { type: boolean }
        distanceFilter: { $ref: '#/components/schemas/DistanceFilter' }
        items:
          type: array
          items: { $ref: '#/components/schemas/CalculationItem' }
        results:
          type: array
          description: по одной вкладке на группу отходов
          items:
            type: object
            required: [wasteGroupId, options]
            properties:
              wasteGroupId: { type: string }
              options: { $ref: '#/components/schemas/PlacementOptionPage' }
        selection: { $ref: '#/components/schemas/SelectionState' }
        allocation: { $ref: '#/components/schemas/AllocationState' }
        dataFreshness: { $ref: '#/components/schemas/DataFreshness' }

    CalculationSummary:
      type: object
      required: [id, createdAt, pickupAddress, total]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        pickupAddress: { type: string }
        total: { $ref: '#/components/schemas/Money' }
        quoteNumber: { type: string, nullable: true }

    CalculationSummaryPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/CalculationSummary' }

    SelectionEntry:
      type: object
      required: [wasteGroupId, landfillId]
      properties:
        wasteGroupId: { type: string }
        landfillId: { type: string }
      additionalProperties: false

    SelectionRequest:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          description: выбор задаётся целиком; пустой массив снимает выбор
          items: { $ref: '#/components/schemas/SelectionEntry' }
      additionalProperties: false

    SelectionState:
      type: object
      required: [entries, selectedLandfills, total, warnings]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/SelectionEntry' }
        selectedLandfills: { type: integer }
        total: { $ref: '#/components/schemas/Money' }
        warnings:
          type: array
          description: |
            Предупреждения выбора. Заблокированный полигон остаётся выбранным
            по решению пользователя — предупреждение не отменяет выбор (Э-12).
          items:
            type: object
            required: [code, landfillId, message]
            properties:
              code: { type: string, enum: [landfillBlocked, landfillDataStale] }
              landfillId: { type: string }
              message: { type: string }

    AllocationEntry:
      type: object
      required: [wasteGroupId, landfillId, quantity]
      properties:
        wasteGroupId: { type: string }
        landfillId: { type: string }
        quantity: { $ref: '#/components/schemas/Quantity' }
      additionalProperties: false

    AllocationRequest:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/AllocationEntry' }
      additionalProperties: false

    AllocationState:
      type: object
      required: [entries, total]
      properties:
        entries:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/AllocationEntry'
              - type: object
                required: [transportCost, totalCost]
                properties:
                  transportCost: { $ref: '#/components/schemas/Money' }
                  disposalCost:
                    allOf: [{ $ref: '#/components/schemas/Money' }]
                    nullable: true
                  totalCost: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }

    Access:
      type: object
      description: |
        Доступ к содержимому ответа. Когда `granted` ложно, содержательные
        поля пусты, а интерфейс показывает замок вместо выдумки. Что именно
        закрыто подпиской, не установлено — Q-011.
      required: [granted]
      properties:
        granted: { type: boolean }
        reason:
          type: string
          nullable: true
          enum: [subscriptionRequired, authenticationRequired, null]

    Encumbrance:
      type: object
      description: |
        Обременение по пути: пост ДПС либо пункт весового контроля.
        Источник данных и допустимость показа не подтверждены (Q-003),
        поэтому до ответа список остаётся пустым.
      required: [kind, title]
      properties:
        kind: { type: string, enum: [trafficPolicePost, weightControl] }
        title: { type: string }
        coordinates: { $ref: '#/components/schemas/Coordinates' }

    RouteLeg:
      type: object
      required: [landfillId, distanceKm]
      properties:
        landfillId: { type: string }
        distanceKm: { type: number, format: double }
        durationMinutes: { type: integer, nullable: true }
        externalMapUrl:
          type: string
          nullable: true
          description: ссылка на маршрут во внешних картах (R-034, R-057)
        encumbrances:
          type: array
          items: { $ref: '#/components/schemas/Encumbrance' }

    RouteSummary:
      type: object
      required: [access, legs, total]
      properties:
        access: { $ref: '#/components/schemas/Access' }
        legs:
          type: array
          items: { $ref: '#/components/schemas/RouteLeg' }
        total: { $ref: '#/components/schemas/Money' }

    QuoteRequest:
      type: object
      description: необязательные реквизиты получателя предложения
      properties:
        customerName: { type: string }
        comment: { type: string }
      additionalProperties: false

    Quote:
      type: object
      required: [id, number, issuedAt, validUntil, total, preliminary, documentUrl]
      properties:
        id: { type: string }
        number: { type: string, example: КП-2026-0917-014 }
        issuedAt: { type: string, format: date-time }
        validUntil:
          type: string
          format: date
          description: срок действия цены; его длительность не задана — Q-010
        total: { $ref: '#/components/schemas/Money' }
        preliminary: { type: boolean }
        documentUrl: { type: string, description: путь к файлу предложения }

    PickupRequestInput:
      type: object
      required: [contactName, phone, personalDataConsent]
      properties:
        calculationId: { type: string }
        landfillId: { type: string }
        contactName: { type: string, maxLength: 200 }
        phone: { type: string, pattern: '^\+7[0-9]{10}$', example: '+79161234567' }
        personalDataConsent:
          type: boolean
          description: |
            Явное согласие на обработку персональных данных. Без него заявка
            не создаётся (R-054): признак обязателен и проверяется на сервере.
      additionalProperties: false

    PickupRequest:
      type: object
      required: [id, createdAt, state]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        state: { type: string, enum: [accepted] }
        message: { type: string }

    DocumentService:
      type: object
      required: [id, name, priceOnRequest]
      properties:
        id: { type: string }
        name: { type: string }
        priceFrom:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          nullable: true
          description: цена «от»; отсутствует, когда цена по запросу
        priceOnRequest: { type: boolean }

    DocumentServicePage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/DocumentService' }

    DocumentServiceOrderInput:
      type: object
      required: [serviceId, objectAddress, personalDataConsent]
      properties:
        serviceId: { type: string }
        objectAddress: { type: string }
        comment: { type: string }
        personalDataConsent: { type: boolean }
      additionalProperties: false

    DocumentServiceOrder:
      type: object
      required: [id, serviceId, createdAt, state]
      properties:
        id: { type: string }
        serviceId: { type: string }
        createdAt: { type: string, format: date-time }
        state: { type: string, enum: [accepted] }
        message: { type: string }

    SubscriberRole:
      type: string
      description: роль подписчика — перевозчик либо демонтажная компания
      enum: [carrier, demolitionCompany]

    SubscriptionState:
      type: object
      required: [state]
      properties:
        state:
          type: string
          description: |
            `none` — подписки нет; `pending` — заявка оставлена, оплата идёт
            вне сервиса; `active` — подписка подтверждена.
          enum: [none, pending, active]
        activeUntil: { type: string, format: date, nullable: true }

    SubscriptionRequestInput:
      type: object
      required: [role, companyName, inn]
      properties:
        role: { $ref: '#/components/schemas/SubscriberRole' }
        companyName: { type: string }
        inn: { type: string, pattern: '^[0-9]{10}$|^[0-9]{12}$' }
        phone:
          type: string
          pattern: '^\+7[0-9]{10}$'
          description: |
            Телефон перевозчика в каноническом виде: «+7» и десять цифр
            (R-051). Необязателен — участник пришёл из мессенджера, и
            обратный канал у менеджера есть и без телефона.
        registeredInAisOssig:
          type: boolean
          description: транспорт зарегистрирован в АИС ОССиГ (R-051)
        hasTransportLicense:
          type: boolean
          description: |
            Лицензия на транспортирование отходов I–IV классов опасности
            (R-051). Пусто означает «не сообщил», а false — «сообщил, что
            лицензии нет»: по второму ответу перевозчику откажут.
        hasSanitaryConclusion:
          type: boolean
          description: |
            Санитарно-эпидемиологическое заключение (R-051) — условие выдачи
            лицензии с 01.09.2026, но у выданных раньше его может не быть.
      additionalProperties: false

    SubscriptionRequest:
      type: object
      required: [id, createdAt, subscription]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        subscription: { $ref: '#/components/schemas/SubscriptionState' }
        message: { type: string }

    SessionRequest:
      type: object
      required: [initData, personalDataConsent]
      properties:
        initData:
          type: string
          maxLength: 4096
          description: |
            Строка стартовых параметров мини-приложения MAX как есть, без
            разбора на стороне клиента: сервер сам разбирает её и проверяет
            подпись поля `hash`. Разобранный клиентом объект не принимается —
            проверять подпись можно только по исходной строке.
        personalDataConsent:
          type: boolean
          description: явное согласие на обработку персональных данных (R-054)
      additionalProperties: false

    Profile:
      type: object
      required: [id, maxUserId, subscription]
      properties:
        id: { type: string }
        maxUserId:
          type: string
          description: учётная запись платформы MAX, по которой опознан пользователь
        displayName: { type: string, nullable: true }
        role:
          allOf: [{ $ref: '#/components/schemas/SubscriberRole' }]
          nullable: true
        companyName: { type: string, nullable: true }
        inn: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        registeredInAisOssig: { type: boolean, nullable: true }
        hasTransportLicense: { type: boolean, nullable: true }
        hasSanitaryConclusion: { type: boolean, nullable: true }
        subscription: { $ref: '#/components/schemas/SubscriptionState' }

    Session:
      type: object
      required: [accessToken, expiresIn, profile]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: сколько секунд маркер действует }
        profile: { $ref: '#/components/schemas/Profile' }

    LandfillReviewInput:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string, maxLength: 2000 }
      additionalProperties: false

    LandfillReview:
      type: object
      required: [id, landfillId, rating, createdAt]
      properties:
        id: { type: string }
        landfillId: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    LandfillReviewPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items, averageRating]
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/LandfillReview' }
            averageRating: { type: number, format: double, nullable: true }
